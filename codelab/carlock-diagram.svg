<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">
  <rect width="760" height="300" rx="12" fill="#1a1a19"/>
  <!-- callers -->
  <rect x="24" y="48" width="170" height="64" rx="10" fill="#232322" stroke="#3987e5" stroke-width="2"/>
  <text x="109" y="76" text-anchor="middle" fill="#f0efec" font-weight="600">infotainment app</text>
  <text x="109" y="98" text-anchor="middle" fill="#c3c2b7">type app_t · uid 0</text>
  <rect x="24" y="188" width="170" height="64" rx="10" fill="#232322" stroke="#0ca30c" stroke-width="2"/>
  <text x="109" y="216" text-anchor="middle" fill="#f0efec" font-weight="600">key-fob receiver</text>
  <text x="109" y="238" text-anchor="middle" fill="#c3c2b7">type keyfob_t</text>
  <!-- kernel band -->
  <rect x="268" y="20" width="200" height="260" rx="10" fill="#0d0d0d" stroke="#383835"/>
  <text x="368" y="44" text-anchor="middle" fill="#c3c2b7" font-weight="600">QNX 8.0 microkernel</text>
  <text x="368" y="62" text-anchor="middle" fill="#898781" font-size="12">checks every channel connect</text>
  <text x="368" y="78" text-anchor="middle" fill="#898781" font-size="12">against the secpol policy</text>
  <!-- daemon -->
  <rect x="540" y="40" width="196" height="220" rx="10" fill="#232322" stroke="#898781" stroke-width="1.5"/>
  <text x="638" y="66" text-anchor="middle" fill="#f0efec" font-weight="600">carlockd</text>
  <text x="638" y="84" text-anchor="middle" fill="#c3c2b7" font-size="12">carlockd_t → carlockd_run_t</text>
  <rect x="556" y="100" width="164" height="54" rx="8" fill="#1a1a19" stroke="#3987e5"/>
  <text x="638" y="122" text-anchor="middle" fill="#f0efec">/dev/carlock/status</text>
  <text x="638" y="142" text-anchor="middle" fill="#898781" font-size="12">carlock_status_ch_t</text>
  <rect x="556" y="180" width="164" height="54" rx="8" fill="#1a1a19" stroke="#0ca30c"/>
  <text x="638" y="202" text-anchor="middle" fill="#f0efec">/dev/carlock/command</text>
  <text x="638" y="222" text-anchor="middle" fill="#898781" font-size="12">carlock_command_ch_t</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/></marker>
  </defs>
  <!-- app -> status: allowed -->
  <path d="M194,76 C330,76 420,120 554,124" fill="none" stroke="#3987e5" stroke-width="2" marker-end="url(#a)"/>
  <text x="300" y="104" fill="#3987e5" font-size="12">status: allowed</text>
  <!-- app -> command: refused -->
  <path d="M194,96 C280,130 330,170 368,186" fill="none" stroke="#d03b3b" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="356" y1="176" x2="380" y2="200" stroke="#d03b3b" stroke-width="3"/>
  <line x1="380" y1="176" x2="356" y2="200" stroke="#d03b3b" stroke-width="3"/>
  <text x="392" y="196" fill="#d03b3b" font-size="12" font-weight="600">EPERM</text>
  <text x="392" y="212" fill="#d03b3b" font-size="12">even as root</text>
  <!-- keyfob -> command and status -->
  <path d="M194,220 C330,220 420,210 554,208" fill="none" stroke="#0ca30c" stroke-width="2" marker-end="url(#a)"/>
  <text x="290" y="246" fill="#0ca30c" font-size="12">lock / unlock: allowed</text>
  <path d="M194,204 C330,180 430,140 554,134" fill="none" stroke="#0ca30c" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#a)"/>
</svg>
