<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Kervix: agents propose, QNX decides</title>
  <desc id="desc">The host agent proposes through its gateway. Kervix on QNX checks live vehicle state and issues a single-use grant. The actuator revalidates the grant. Agent, driver, observer and world gateways have separate QNX security types.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#5badff"/></marker></defs>
  <rect width="1920" height="1080" fill="#080d14"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="96" y="108" fill="#5badff" font-size="24" font-weight="700" letter-spacing="4">KERVIX / EXECUTION AUTHORITY</text>
    <text x="96" y="210" fill="#f5f8ff" font-size="62" font-weight="700">Agents propose. QNX decides.</text>
    <rect x="708" y="284" width="1116" height="390" rx="18" fill="#101f31" stroke="#5badff" stroke-width="2"/>
    <text x="748" y="332" fill="#b2d8ff" font-size="24" font-weight="700">QNX 8.0 · SECURE RELEASE IMAGE</text>
    <rect x="96" y="376" width="400" height="202" rx="12" fill="#121b27" stroke="#304055" stroke-width="2"/>
    <text x="128" y="425" fill="#9dacbf" font-size="22">HOST DOMAIN</text>
    <text x="128" y="480" fill="#f5f8ff" font-size="36" font-weight="700">AI agent + bridge</text>
    <text x="128" y="527" fill="#d0dbea" font-size="24">Action + parameters</text>
    <path d="M514 474H748" stroke="#5badff" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="548" y="447" fill="#d0dbea" font-size="22">agent gateway</text>
    <rect x="776" y="376" width="456" height="202" rx="12" fill="#121b27" stroke="#304055" stroke-width="2"/>
    <text x="808" y="429" fill="#f5f8ff" font-size="36" font-weight="700">kervixd</text>
    <text x="808" y="476" fill="#d0dbea" font-size="24">Policy + live vehicle state</text>
    <text x="808" y="526" fill="#b2d8ff" font-size="22" font-weight="700">ALLOW · ESCALATE · BLOCK</text>
    <path d="M1250 474H1380" stroke="#5badff" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="1258" y="443" fill="#d0dbea" font-size="20">grant</text>
    <rect x="1404" y="376" width="378" height="202" rx="12" fill="#121b27" stroke="#304055" stroke-width="2"/>
    <text x="1436" y="429" fill="#f5f8ff" font-size="36" font-weight="700">Actuator</text>
    <text x="1436" y="476" fill="#d0dbea" font-size="24">Revalidates the grant</text>
    <text x="1436" y="523" fill="#d0dbea" font-size="24">Applies it once</text>
    <text x="748" y="632" fill="#9dacbf" font-size="23">Signed decisions and effects → AAC ledger → offline verification</text>
    <text x="96" y="754" fill="#d0dbea" font-size="26">Four gateway roles. Separate security types. Kernel-enforced access.</text>
    <g fill="#121b27" stroke="#304055" stroke-width="2">
      <rect x="96" y="792" width="408" height="124" rx="10"/><rect x="536" y="792" width="408" height="124" rx="10"/>
      <rect x="976" y="792" width="408" height="124" rx="10"/><rect x="1416" y="792" width="408" height="124" rx="10"/>
    </g>
    <g fill="#f5f8ff" font-size="27" font-weight="700"><text x="124" y="838">Agent · propose</text><text x="564" y="838">Driver · approve</text><text x="1004" y="838">Observer · read</text><text x="1444" y="838">World · simulate</text></g>
    <g fill="#9dacbf" font-family="Menlo, monospace" font-size="22"><text x="124" y="881">agentgw_t</text><text x="564" y="881">hmigw_t</text><text x="1004" y="881">obsgw_t</text><text x="1444" y="881">worldgw_t</text></g>
  </g>
</svg>
