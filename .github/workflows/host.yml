name: host

# Host-only CI. The QNX SDP is licensed per developer and cannot be installed
# in CI, so QNX builds are reproduced locally (make target). CI verifies
# everything that does not need the SDP: the portable core, codegen
# consistency, and AAC/COSE conformance against the published verifier.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  host:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: "Host TypeScript (bridge, agent, dashboard): typecheck, tests against the fake target, dashboard build"
        run: npm run -s typecheck && npm run -s test:host && npm run -s dashboard
      - name: Codegen is up to date
        run: npm run -s codegen:check
      - name: libkxcore (strict warnings) + unit tests
        run: |
          cmake -S . -B build/host -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/host
          ctest --test-dir build/host --output-on-failure
      - name: libkxcore under ASan + UBSan
        run: |
          cmake -S . -B build/asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          cmake --build build/asan
          ctest --test-dir build/asan --output-on-failure
      - name: Telemetry seqlock under ThreadSanitizer
        run: mkdir -p build && make -s tsan
      - name: Fuzz the gateway's network parser (libFuzzer + ASan/UBSan, 60 s, Linux)
        if: runner.os == 'Linux'
        run: make -s fuzz-wire FUZZ_SECONDS=60
      - name: Spike S5 — AAC draft-04 + COSE conformance vs @decionis/verify
        run: npm run -s spike:s5
      - name: Rebuild the replay engine (libkxcore -> WebAssembly) from source (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq lld >/dev/null && wasm/build.sh
      - name: Conformance — intent/capsule parity, QNX dossier fixture, signed-lie replay
        run: npm run -s conformance
